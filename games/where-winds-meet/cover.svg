<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 280 160" width="280" height="160" role="img" aria-label="Where Winds Meet cover art placeholder">
  <defs>
    <linearGradient id="cover-gradient" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1a1d23"/>
      <stop offset="100%" stop-color="#0f3d2d"/>
    </linearGradient>
  </defs>
  <!-- Background gradient -->
  <rect width="280" height="160" fill="url(#cover-gradient)"/>
  <!-- Jade horizontal rule above title -->
  <rect x="120" y="60" width="40" height="2" fill="#3fb98f"/>
  <!-- Title text -->
  <text
    x="140"
    y="84"
    font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif"
    font-size="14"
    font-weight="600"
    fill="#e8e4d8"
    text-anchor="middle"
    dominant-baseline="middle"
  >Where Winds Meet</text>
  <!-- Gold accent dot below title -->
  <circle cx="140" cy="104" r="3" fill="#d4af37"/>
</svg>
